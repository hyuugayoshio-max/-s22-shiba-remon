<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="赤奈スマホ">
<title>焼肉の女 2話S21 赤奈スマホ（ロック→パスコード→ホーム）</title>
<style>
/* ===== 待受画像：同じフォルダに置くと差し替わります。無い場合はCSSで描いた壁紙が出ます ===== */
:root{
  --wall: url("wallpaper_akana.jpg");       /* ロック画面の待受 */
  --homewall: url("wallpaper_akana_home.jpg"); /* ホーム画面の壁紙 */
}
</style>
<script>
/* ===== ここを書き換えて調整 ===== */
const CONFIG = {
  time: "22:57",              // 時刻（2話S21 道 時間設定1028版は10/14水 18:06。日付は指示により2026/10/1木）
  date: "10月1日 木曜日",     // ロック画面の日付
  battery: 80,                // 電池残量 %
  network: "4G",              // 電波表示の横の文字（空欄なら非表示）
  showStatusBar: false,       // 画面上部の時刻・電波・電池を出すか（出さない）
  passcode: "01281",          // パスコード（5桁）
  autoSpeed: 380,             // Aキー自動入力の1桁あたりの間隔(ms)
  // ホーム画面ウィジェット
  weather: {place:"東京都", temp:"18°", sky:"晴れ", hi:"22°", lo:"14°"},   // 18時台（日の入り後）なので夜の表示
  calendar: {day:"1", week:"木曜日", event:"", eventTime:""}, // 予定なし（文言を入れると表示されます）
  // アプリ（名前は一般名詞のみ）
  apps: ["カメラ","写真","カレンダー","時計","メール","メモ","地図","天気","計算機","ヘルス","ファイル","設定"],
  dock: ["電話","ブラウザ","メッセージ","音楽"]
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
body{--st:0px;--sb:0px}
body.phone .screen{position:fixed;top:0;right:0;left:0;width:auto;max-width:none;aspect-ratio:auto;
  /* iPhoneのホーム画面から開くと、表示が本体の時刻表示の裏から始まるのに高さはその分短く計算される。
     その不足分（＝上の安全領域の高さ）を足して、下端まで埋める */
  height:calc(100% + env(safe-area-inset-top))}
/* 画面の外側（上の時刻表示の裏・下端）も壁紙と同じ色にして、黒い帯が出ないようにする */
html.phone,html.phone body{background:linear-gradient(180deg,#dcecee 0%,#a9dcd9 40%,#77b0e0 75%,#3a66c4 100%) fixed}
body.phone{--sb:max(0px,calc(env(safe-area-inset-bottom) - 6vw))}
body.phone{--st:max(0px,calc(env(safe-area-inset-top) - 10vw))}
body.nostatus .status,body.phone .homebar{display:none}
.screen{touch-action:none;position:relative;height:100vh;aspect-ratio:390/844;max-width:100vw;container-type:inline-size;overflow:hidden;color:#fff;background:#000}
.layer{position:absolute;inset:0;transition:opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1), filter .35s;opacity:0;pointer-events:none}
.layer.on{opacity:1;pointer-events:auto}

/* 壁紙（CSSで描いた抽象柄＋粒子感） */
.wall{position:absolute;inset:0;
  background:
    var(--wall) center/cover no-repeat,
    radial-gradient(120% 62% at 112% 30%, rgba(255,255,255,0) 35.2%, rgba(255,255,255,.65) 36%, rgba(255,255,255,0) 37.6%),
    radial-gradient(95% 55% at -15% 78%, rgba(255,255,255,0) 43.4%, rgba(255,255,255,.55) 44.2%, rgba(255,255,255,0) 45.8%),
    radial-gradient(80% 42% at 92% 102%, rgba(255,255,255,0) 47.4%, rgba(255,255,255,.5) 48.3%, rgba(255,255,255,0) 50%),
    radial-gradient(120% 62% at 112% 30%, #5a8cf0 0%, #3561d6 24%, #2446ad 35.4%, rgba(36,70,173,0) 36.2%),
    radial-gradient(95% 55% at -15% 78%, #a4e6d6 0%, #6fcbb9 30%, #4fae9f 44%, rgba(79,174,159,0) 44.6%),
    radial-gradient(80% 42% at 92% 102%, #6a9cf0 0%, #3b6fd8 34%, #2d58bf 48%, rgba(45,88,191,0) 48.6%),
    radial-gradient(70% 34% at 28% 18%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%),
    radial-gradient(60% 40% at 70% 60%, rgba(40,90,190,.18), rgba(40,90,190,0) 70%),
    linear-gradient(168deg,#e6f3f3 0%,#acdcd8 38%,#7bb7e3 70%,#3a66c4 100%)}
#home .wall{background:
    var(--homewall) center/cover no-repeat,
    radial-gradient(120% 62% at 112% 30%, rgba(255,255,255,0) 35.2%, rgba(255,255,255,.65) 36%, rgba(255,255,255,0) 37.6%),
    radial-gradient(95% 55% at -15% 78%, rgba(255,255,255,0) 43.4%, rgba(255,255,255,.55) 44.2%, rgba(255,255,255,0) 45.8%),
    radial-gradient(80% 42% at 92% 102%, rgba(255,255,255,0) 47.4%, rgba(255,255,255,.5) 48.3%, rgba(255,255,255,0) 50%),
    radial-gradient(120% 62% at 112% 30%, #5a8cf0 0%, #3561d6 24%, #2446ad 35.4%, rgba(36,70,173,0) 36.2%),
    radial-gradient(95% 55% at -15% 78%, #a4e6d6 0%, #6fcbb9 30%, #4fae9f 44%, rgba(79,174,159,0) 44.6%),
    radial-gradient(80% 42% at 92% 102%, #6a9cf0 0%, #3b6fd8 34%, #2d58bf 48%, rgba(45,88,191,0) 48.6%),
    radial-gradient(70% 34% at 28% 18%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%),
    radial-gradient(60% 40% at 70% 60%, rgba(40,90,190,.18), rgba(40,90,190,0) 70%),
    linear-gradient(168deg,#e6f3f3 0%,#acdcd8 38%,#7bb7e3 70%,#3a66c4 100%)}
.wall::before{content:"";position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ステータスバー */
.status{position:absolute;top:4cqw;left:8cqw;right:6.5cqw;display:flex;justify-content:space-between;align-items:center;font-size:4.3cqw;font-weight:600;z-index:5;letter-spacing:.01em}
.icons{display:flex;gap:1.6cqw;align-items:center}
.bars{display:flex;gap:.6cqw;align-items:flex-end;height:3.1cqw}
.bars i{display:block;width:1.05cqw;background:#fff;border-radius:.3cqw}
.net{font-size:3.6cqw;font-weight:600}
.batt{position:relative;width:6.8cqw;height:3.3cqw;border:.35cqw solid rgba(255,255,255,.55);border-radius:1.1cqw;padding:.35cqw}
.batt::after{content:"";position:absolute;right:-1cqw;top:.9cqw;width:.5cqw;height:1.1cqw;border-radius:0 .4cqw .4cqw 0;background:rgba(255,255,255,.55)}
.batt b{display:block;height:100%;background:#fff;border-radius:.5cqw}
.homebar{position:absolute;bottom:2.2cqw;left:50%;transform:translateX(-50%);width:35cqw;height:1.35cqw;border-radius:1cqw;background:rgba(255,255,255,.95);z-index:6;transition:background .3s}
.dark .homebar{background:rgba(0,0,0,.6)}

/* ① ロック画面 */
#lock{transition:opacity .35s, transform .4s cubic-bezier(.2,.8,.2,1)}
#lock:not(.on){transform:translateY(-18%)}
#lock.drag{transition:none}
#lock::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 72%,rgba(0,0,0,.22) 100%);pointer-events:none}
#lock .lk{position:absolute;top:calc(14.5cqw + var(--st));left:50%;transform:translateX(-50%);width:4.6cqw;z-index:2}
#lock .date{position:absolute;top:calc(22cqw + var(--st));width:100%;text-align:center;font-size:5.1cqw;font-weight:600;z-index:2;text-shadow:0 .2cqw 1cqw rgba(0,0,0,.18)}
#lock .time{position:absolute;top:calc(29cqw + var(--st));width:100%;text-align:center;font-size:25.5cqw;font-weight:700;letter-spacing:-.02em;line-height:1;z-index:2;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.78));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .4cqw 1.6cqw rgba(0,0,0,.16))}
.qbtn{position:absolute;bottom:calc(9.5cqw + var(--sb));width:12.5cqw;height:12.5cqw;border-radius:50%;background:rgba(30,40,60,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:2}
.qbtn svg{width:5.4cqw;height:5.4cqw}
.qbtn.l{left:11cqw}.qbtn.r{right:11cqw}
#lock .hint{position:absolute;bottom:calc(6.5cqw + var(--sb));width:100%;text-align:center;font-size:3.4cqw;font-weight:500;opacity:.8;z-index:2}

/* ② パスコード */
#pass .wall{filter:blur(7cqw) saturate(1.2) brightness(.62);transform:scale(1.25)}
#pass .ttl{position:absolute;top:calc(36cqw + var(--st));width:100%;text-align:center;font-size:5cqw;font-weight:500;z-index:2}
.dots{position:absolute;top:calc(47cqw + var(--st));left:0;right:0;display:flex;justify-content:center;gap:5.4cqw;z-index:2}
.dots i{width:3.5cqw;height:3.5cqw;border-radius:50%;border:.35cqw solid #fff;transition:background .08s}
.dots i.f{background:#fff}
.dots.shake{animation:shake .45s}
#pass .ttl,#pass .dots,#pass .pad,#pass .ptxt{transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
#pass:not(.on) .pad{transform:translate(-50%,6%)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5cqw)}40%{transform:translateX(5cqw)}60%{transform:translateX(-3cqw)}80%{transform:translateX(3cqw)}}
.pad{position:absolute;top:calc(66cqw + var(--st));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,20.5cqw);gap:4.2cqw 7.6cqw;z-index:2}
.key{width:20.5cqw;height:20.5cqw;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
.key b{font-size:9.4cqw;font-weight:400;line-height:1}
.key small{font-size:2.3cqw;font-weight:600;letter-spacing:.18em;margin-top:.4cqw;height:2.6cqw}
.key.down{background:rgba(255,255,255,.62);transition:none}
.key{transition:background .45s ease-out}
.key.blank{background:none;backdrop-filter:none;pointer-events:none}
.ptxt{position:absolute;bottom:calc(10cqw + var(--sb));font-size:4.2cqw;z-index:2;cursor:pointer;padding:2cqw}
#emg{left:12cqw}#cancel{right:12cqw}

/* ③ ホーム */
#home{transform:scale(1.12);filter:blur(2px)}
#home.on{transform:scale(1);filter:none}
.widgets{position:absolute;top:calc(14cqw + var(--st));left:6cqw;right:6cqw;display:flex;justify-content:space-between;z-index:2}
.wcol{width:40.5cqw;text-align:center}
.widget{width:40.5cqw;height:40.5cqw;border-radius:9.5cqw;padding:5cqw 5.4cqw;text-align:left;position:relative;overflow:hidden;box-shadow:0 1cqw 3cqw rgba(0,0,0,.12)}
.wlabel{font-size:3.15cqw;font-weight:500;margin-top:1.8cqw;text-shadow:0 .2cqw 1cqw rgba(0,0,0,.3)}
.w-weather{background:linear-gradient(180deg,#141c3a 0%,#26335e 60%,#3a4a7c 100%)}
.w-weather .pl{font-size:3.9cqw;font-weight:700;display:flex;align-items:center;gap:1cqw}
.w-weather .pl svg{width:2.6cqw}
.w-weather .tp{font-size:11cqw;font-weight:300;line-height:1.05;margin-top:.3cqw;letter-spacing:-.02em}
.w-weather .ico{width:5.6cqw;margin-top:1.2cqw;display:block}
.w-weather .sk{font-size:3.1cqw;font-weight:600;margin-top:.4cqw}
.w-weather .hl{font-size:3.1cqw;font-weight:600;margin-top:.2cqw;white-space:nowrap}
.w-cal{background:#fff;color:#1d1d1f}
.w-cal .wk{font-size:3.4cqw;font-weight:700;color:#ec4c4c;letter-spacing:.02em}
.w-cal .dy{font-size:14cqw;font-weight:300;line-height:1;margin-top:.6cqw;letter-spacing:-.03em}
.w-cal .ev{position:absolute;left:5.4cqw;right:5cqw;bottom:5cqw;font-size:3.1cqw;line-height:1.35;color:#8e8e93;font-weight:500}
.w-cal .ev.has{color:#1d1d1f;border-left:.9cqw solid #ec4c4c;padding-left:2cqw}
.w-cal .ev small{display:block;color:#8e8e93;font-size:2.7cqw}
.grid{position:absolute;top:calc(67.5cqw + var(--st));left:6cqw;right:6cqw;display:grid;grid-template-columns:repeat(4,1fr);row-gap:5.4cqw;z-index:2}
.app{display:flex;flex-direction:column;align-items:center}
#home.on .app,#home.on .wcol,#home.on .dock,#home.on .spill{animation:pop .55s cubic-bezier(.2,.9,.25,1.05) both;animation-delay:var(--d,0s)}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
#home.on .spill{animation-name:popc}
@keyframes popc{from{transform:translateX(-50%) scale(.55);opacity:0}to{transform:translateX(-50%);opacity:1}}
.ic{width:16cqw;height:16cqw;border-radius:3.7cqw;overflow:hidden;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.16), inset 0 0 0 .15cqw rgba(255,255,255,.12)}
.ic svg{width:100%;height:100%;display:block}
.nm{font-size:3cqw;font-weight:500;margin-top:1.5cqw;text-shadow:0 .15cqw .8cqw rgba(0,0,0,.4);white-space:nowrap;letter-spacing:.01em}
.spill{position:absolute;bottom:calc(34.5cqw + var(--sb));left:50%;transform:translateX(-50%);padding:1.7cqw 4.6cqw;border-radius:5cqw;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:3.3cqw;font-weight:600;display:flex;align-items:center;gap:1.3cqw;z-index:2;box-shadow:inset 0 0 0 .2cqw rgba(255,255,255,.18)}
.spill svg{width:3.3cqw}
.dock{position:absolute;bottom:calc(4.5cqw + var(--sb));left:3.5cqw;right:3.5cqw;height:25cqw;border-radius:10.5cqw;background:rgba(255,255,255,.22);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);display:flex;justify-content:space-around;align-items:center;padding:0 3cqw;z-index:2;box-shadow:inset 0 0 0 .2cqw rgba(255,255,255,.2)}
.dock .ic{width:16.5cqw;height:16.5cqw}

</style>
</head>
<body>
<div class="screen" id="screen">

  <!-- ① ロック画面 -->
  <div class="layer on" id="lock">
    <div class="wall"></div>
    <div class="status"><span></span><span class="icons" data-icons></span></div>
    <svg class="lk" viewBox="0 0 24 30"><path d="M6 13V9a6 6 0 0 1 12 0v4" fill="none" stroke="#fff" stroke-width="2.6"/><rect x="2.5" y="13" width="19" height="15" rx="3.5" fill="#fff"/></svg>
    <div class="date" id="dt"></div>
    <div class="time" id="tm"></div>
    <div class="qbtn l"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 2.5h8v3.5l-2 3V21a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V9l-2-3z"/><rect x="11" y="12" width="2" height="3" rx="1" fill="rgba(30,40,60,.6)"/></svg></div>
    <div class="qbtn r"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.6-2.2h5.8L16.5 6H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6" fill="rgba(30,40,60,.75)"/></svg></div>
    <div class="hint">上にスワイプでロック解除</div>
  </div>

  <!-- ② パスコード入力 -->
  <div class="layer" id="pass">
    <div class="wall"></div>
    <div class="ttl">パスコードを入力</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <div class="ptxt" id="emg">緊急</div>
    <div class="ptxt" id="cancel">キャンセル</div>
  </div>

  <!-- ③ ホーム画面 -->
  <div class="layer" id="home">
    <div class="wall"></div>
    <div class="status"><span id="htm"></span><span class="icons" data-icons></span></div>
    <div class="widgets">
      <div class="wcol">
        <div class="widget w-weather">
          <div class="pl"><span id="wpl"></span><svg viewBox="0 0 10 10" fill="#fff"><path d="M9.5.5 .5 4.3l4 1.2 1.2 4z"/></svg></div>
          <div class="tp" id="wtp"></div>
          <svg class="ico" viewBox="0 0 32 24"><path d="M14 3a8 8 0 1 0 9 10A6.5 6.5 0 0 1 14 3z" fill="#f4e7a1"/></svg>
          <div class="sk" id="wsk"></div>
          <div class="hl" id="whl"></div>
        </div>
        <div class="wlabel">天気</div>
      </div>
      <div class="wcol">
        <div class="widget w-cal">
          <div class="wk" id="cwk"></div>
          <div class="dy" id="cdy"></div>
          <div class="ev" id="cev"></div>
        </div>
        <div class="wlabel">カレンダー</div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="spill"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6" stroke-linecap="round"/></svg>検索</div>
    <div class="dock" id="dock"></div>
  </div>

  <div class="homebar"></div>
</div>

<script>
const $=id=>document.getElementById(id);
/* スマホ実機（タッチ操作・画面幅が狭い）なら画面いっぱいに表示 */
if(matchMedia("(pointer:coarse)").matches&&Math.min(screen.width,innerWidth)<700){document.body.classList.add("phone");
  document.documentElement.classList.add("phone");}
if(!CONFIG.showStatusBar)document.body.classList.add("nostatus");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
/* --- ステータスバー・文言 --- */
const icons=`<span class="bars"><i style="height:40%"></i><i style="height:60%"></i><i style="height:80%"></i><i style="height:100%"></i></span>${CONFIG.network?`<span class="net">${esc(CONFIG.network)}</span>`:""}<span class="batt"><b style="width:${Math.max(8,CONFIG.battery)}%"></b></span>`;
document.querySelectorAll("[data-icons]").forEach(el=>el.innerHTML=icons);
$("dt").textContent=CONFIG.date;$("tm").textContent=CONFIG.time;$("htm").textContent=CONFIG.time;
const W=CONFIG.weather;$("wpl").textContent=W.place;$("wtp").textContent=W.temp;$("wsk").textContent=W.sky;$("whl").textContent=`最高${W.hi} 最低${W.lo}`;
const C=CONFIG.calendar;$("cwk").textContent=C.week;$("cdy").textContent=C.day;
if(C.event){$("cev").classList.add("has");$("cev").innerHTML=`<small>${esc(C.eventTime)}</small>${esc(C.event)}`}else{$("cev").textContent="予定なし"}

/* --- アプリアイコン（すべてオリジナルの図形。外部ファイルなし） --- */
const [hh,mm]=CONFIG.time.split(":").map(Number);
const hA=((hh%12)+mm/60)*30, mA=mm*6;
const bg=(id,a,b)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="60" height="60" fill="url(#${id})"/>`;
const gloss=`<rect width="60" height="30" fill="#fff" opacity=".08"/>`;
const ICON={
  "カメラ":`${bg("g1","#474d57","#23272e")}${gloss}<rect x="9" y="19" width="42" height="28" rx="6" fill="#eceff2"/><path d="M21 19l3-5h12l3 5z" fill="#eceff2"/><circle cx="30" cy="33" r="10.5" fill="#2a2f37"/><circle cx="30" cy="33" r="7" fill="#33507e"/><circle cx="30" cy="33" r="4" fill="#142033"/><circle cx="27.5" cy="30.5" r="1.8" fill="#fff" opacity=".85"/><rect x="42" y="22.5" width="5" height="3" rx="1.2" fill="#f5c451"/>`,

};
const tile=(n,label)=>`<div class="app"><div class="ic"><svg viewBox="0 0 60 60">${ICON[n]||`<rect width="60" height="60" fill="#888"/>`}</svg></div>${label?`<div class="nm">${esc(n)}</div>`:""}</div>`;
$("grid").innerHTML=CONFIG.apps.map(n=>tile(n,true)).join("");
/* 中心から外側へ順に出る遅延 */
setTimeout(()=>{const all=[...document.querySelectorAll("#home .wcol,#home .app,#home .spill,#home .dock")];const sc=$("screen").getBoundingClientRect();const cx=sc.left+sc.width/2,cy=sc.top+sc.height/2;all.forEach(el=>{const r=el.getBoundingClientRect();const d=Math.hypot(r.left+r.width/2-cx,r.top+r.height/2-cy)/sc.height;el.style.setProperty("--d",(d*0.28).toFixed(3)+"s")})},0);
$("dock").innerHTML=CONFIG.dock.map(n=>tile(n,false)).join("");

/* --- パスコード --- */
const LEN=CONFIG.passcode.length;
$("dots").innerHTML="<i></i>".repeat(LEN);
const keys=[["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"],null,["0",""],null];
$("pad").innerHTML=keys.map(k=>k?`<div class="key" data-k="${k[0]}"><b>${k[0]}</b><small>${k[1]}</small></div>`:`<div class="key blank"></div>`).join("");
let entered="",state="lock",busy=false,auto=[];
function show(s){state=s;["lock","pass","home"].forEach(id=>$(id).classList.toggle("on",id===s));}
function drawDots(){[...$("dots").children].forEach((d,i)=>d.classList.toggle("f",i<entered.length));$("cancel").textContent=entered?"削除":"キャンセル";}
function flash(k){const el=document.querySelector(`.key[data-k="${k}"]`);if(el){el.classList.add("down");setTimeout(()=>el.classList.remove("down"),160)}}
function press(k){
  if(busy)return;
  if(state==="lock"){show("pass")}
  if(state!=="pass")return;
  flash(k);entered+=k;drawDots();
  if(entered.length===LEN){
    busy=true;
    if(entered===CONFIG.passcode){setTimeout(()=>{show("home");entered="";drawDots();busy=false},220)}
    else{setTimeout(()=>{$("dots").classList.add("shake");setTimeout(()=>{$("dots").classList.remove("shake");entered="";drawDots();busy=false},460)},150)}
  }
}
function back(){if(state!=="pass"||busy)return;if(entered){entered=entered.slice(0,-1);drawDots()}else show("lock")}
function reset(){auto.forEach(clearTimeout);auto=[];busy=false;entered="";drawDots();show("lock")}
function autoplay(){
  reset();
  auto.push(setTimeout(()=>show("pass"),600));
  [...CONFIG.passcode].forEach((k,i)=>auto.push(setTimeout(()=>press(k),1300+i*CONFIG.autoSpeed)));
}
/* --- 操作 --- */
$("pad").addEventListener("pointerdown",e=>{const k=e.target.closest(".key");if(k&&k.dataset.k)press(k.dataset.k)});
$("cancel").addEventListener("click",back);
let y0=null,dy=0;
$("lock").addEventListener("pointerdown",e=>{y0=e.clientY;dy=0;$("lock").classList.add("drag")});
addEventListener("pointermove",e=>{if(y0===null||state!=="lock")return;dy=Math.min(0,e.clientY-y0);$("lock").style.transform=`translateY(${dy}px)`;$("lock").style.opacity=1+dy/500});
function lockUp(){if(y0===null)return;y0=null;const L=$("lock");L.classList.remove("drag");L.style.transform="";L.style.opacity="";show("pass")} // タップでもスワイプでも解除画面へ
addEventListener("pointerup",lockUp);addEventListener("pointercancel",lockUp);
function digitOf(e){
  const m=/^(?:Digit|Numpad)([0-9])$/.exec(e.code||"");if(m)return m[1];
  const k=(e.key||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  return /^[0-9]$/.test(k)?k:null;
}
addEventListener("keydown",e=>{
  const dg=digitOf(e);
  if(dg!==null){e.preventDefault();press(dg)}
  else if(e.key==="Backspace"){back()}
  else if(e.code==="Space"||e.key==="ArrowUp"||e.key==="Enter"){if(state==="lock")show("pass")}
  else if(e.key==="Escape"){if(state==="pass"){entered="";drawDots();show("lock")}}
  else if(e.key==="a"||e.key==="A"){autoplay()}
  else if(e.key==="r"||e.key==="R"){reset()}
});
drawDots();
</script>
